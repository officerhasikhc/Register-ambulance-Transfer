        <p class="footer-text" data-ar="© 2026 مركز حاسك الصحي - جميع الحقوق محفوظة" data-en="© 2026 Hasik Health Center - All Rights Reserved">© 2026 مركز حاسك الصحي - جميع الحقوق محفوظة</p>
    </div>

    <script>
        // Configuration
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwDUAGlnGBKZMhq8UbzEYBUaP3UNi49Be5PdwqQfnyIiB1HomgXVLrmUTrgeLKhyb-j/exec';
        
        let currentLang = localStorage.getItem('appLanguage') || 'ar';

        // Users Database (will be loaded from Google Sheets)
        const USERS = {
            // Admin - has access to all pages
            '65886': { 
                type: 'admin', 
                nameAr: 'عبدالباقي عبدالهادي مرزوق بيت مروس', 
                nameEn: 'Abdulbaqi Abdulhadi Marzouq Bait Marous',
                redirect: 'admin-interface.html',
                canAccessDriver: true,
                canAccessNurse: true
            },
            // Nurses
            '79470': { 
                type: 'nurse', 
                nameAr: 'ميتي ماثيو', 
                nameEn: 'Metty Mathew',
                redirect: 'nurse-interface.html'
            },
            '62971': { 
                type: 'nurse', 
                nameAr: 'شيرين كوريان', 
                nameEn: 'Sherine Kurian',
                redirect: 'nurse-interface.html'
            },
            '85181': { 
                type: 'nurse', 
                nameAr: 'ساميني ثانكاموني', 
                nameEn: 'Samini Thankamony',
                redirect: 'nurse-interface.html'
            },
            '88973': { 
                type: 'nurse', 
                nameAr: 'آنو ماموتيل', 
                nameEn: 'Annu Mamootel',
                redirect: 'nurse-interface.html'
            },
            '57609': { 
                type: 'nurse', 
                nameAr: 'عائشة سعيد بخيت السليمي', 
                nameEn: 'Aisha Said Bakhit Al-Sulaimi',
                redirect: 'nurse-interface.html'
            },
            // Drivers
            '39121': { 
                type: 'driver', 
                employeeType: 'employee',
                nameAr: 'سعد زايد الجنيبي', 
                nameEn: 'SAAD ZAID AL-JUNAIBI',
                redirect: 'driver-interface.html'
            },
            '222975657': { 
                type: 'driver', 
                employeeType: 'daily-paid',
                nameAr: 'حسان ثابت رجب', 
                nameEn: 'HASSAN THABIT RAJAB',
                redirect: 'driver-interface.html'
            },
            '39634': { 
                type: 'driver', 
                employeeType: 'employee',
                nameAr: 'محمد الرضه علي', 
                nameEn: 'MOHAMMED AL-RUDHA ALI',
                redirect: 'driver-interface.html'
            },
            '65870': { 
                type: 'driver', 
                employeeType: 'employee',
                nameAr: 'عبدالعزيز مسلم النقش', 
                nameEn: 'ABDULAZIZ MUSALLEM AL-NAQSH',
                redirect: 'driver-interface.html'
            },
            '41299': { 
                type: 'nurse', 
                nameAr: 'بخيت محمد الغفيلي المهري', 
                nameEn: 'Bakhit Mohamed Al-Ghufaili Al-Mahri',
                redirect: 'nurse-interface.html'
            }
        };

        // PWA Install prompt
        let deferredPrompt;

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            setLanguage(currentLang);
            loadSavedCredentials();
            checkInstallPrompt();
            prefetchOnPageLoad();

            // Speculative prefetch: when user types a known staff number, start loading data early
            var specPrefetchDone = {};
            var specDebounce = null;
            document.getElementById('staffNumber').addEventListener('input', function() {
                var val = this.value.trim();
                if (val.length < 3 || specPrefetchDone[val]) return;
                clearTimeout(specDebounce);
                specDebounce = setTimeout(function() {
                    var user = USERS[val] || findUserInLocalStorage(val);
                    if (user && !specPrefetchDone[val]) {
                        specPrefetchDone[val] = true;
                        prefetchForUserType(user.type, val);
                        // Prefetch target page HTML
                        try {
                            var link = document.createElement('link');
                            link.rel = 'prefetch';
                            link.href = user.redirect;
                            document.head.appendChild(link);
                        } catch(e) {}
                    }
                }, 300);
            });
        });

        /**
         * SMART PRE-WARMING: Start fetching data BEFORE user clicks login
         * If user has a saved session or saved staff number, we know their type
         * and can prefetch their full page data immediately on login page load.
         */
        function prefetchOnPageLoad() {
            try {
                // Check existing session first (user refreshed/returned)
                var session = null;
                try { session = JSON.parse(localStorage.getItem('userSession') || 'null'); } catch(e) {}
                
                if (session && session.type) {
                    prefetchForUserType(session.type, session.staffNumber || '');
                    return;
                }
                
                // Check saved staff number (Remember Me) — look up user type
                var savedNum = localStorage.getItem('savedStaffNumber');
                if (savedNum) {
                    var user = USERS[savedNum] || findUserInLocalStorage(savedNum);
                    if (user) {
                        prefetchForUserType(user.type, savedNum);
                    }
                }
            } catch(e) { console.warn('Prefetch on load error (non-fatal):', e); }
        }

        /**
         * Prefetch full page data based on user type.
         * Stores in DataCache localStorage so target page loads instantly.
         * Returns a Promise that resolves when the FIRST (highest priority) fetch completes.
         */
        function prefetchForUserType(userType, staffNumber) {
            var url = WEB_APP_URL;
            var year = new Date().getFullYear();
            var month = new Date().getMonth() + 1;
            
            if (userType === 'nurse') {
                // Phase 1: Current month (highest priority - immediate)
                var nurseUrl = url + '?action=getNurseData&year=' + year + '&month=' + month;
                if (staffNumber) nurseUrl += '&staffNumber=' + encodeURIComponent(staffNumber);
                var firstFetch = fetch(nurseUrl).then(function(r) { return r.json(); }).then(function(result) {
                    if (result && result.success && typeof DataCache !== 'undefined') {
                        DataCache.set('cache_nurse_data_' + year + '_' + month, result);
                    }
                }).catch(function() {});

                // Phase 2: "all" + adjacent months + rest (parallel batches, faster intervals)
                var monthsToWarm = [];
                monthsToWarm.push({ y: year, m: 'all' });
                if (month > 1) monthsToWarm.push({ y: year, m: month - 1 });
                if (month < 12) monthsToWarm.push({ y: year, m: month + 1 });
                for (var m = month - 2; m >= 1; m--) monthsToWarm.push({ y: year, m: m });
                for (var m2 = month + 2; m2 <= 12; m2++) monthsToWarm.push({ y: year, m: m2 });
                var prevYear = year - 1;
                for (var pm = 12; pm >= 1; pm--) monthsToWarm.push({ y: prevYear, m: pm });

                function fetchNurseMonth(item) {
                    var key = 'cache_nurse_data_' + item.y + '_' + item.m;
                    if (typeof DataCache !== 'undefined') {
                        var existing = DataCache.get(key, 15 * 60 * 1000);
                        if (existing && existing.data && !existing.isExpired) return Promise.resolve();
                    }
                    var warmUrl = url + '?action=getNurseData&year=' + item.y;
                    if (item.m !== 'all') warmUrl += '&month=' + item.m;
                    if (staffNumber) warmUrl += '&staffNumber=' + encodeURIComponent(staffNumber);
                    return fetch(warmUrl).then(function(r) { return r.json(); }).then(function(result) {
                        if (result && result.success && typeof DataCache !== 'undefined') {
                            DataCache.set(key, result);
                        }
                    }).catch(function() {});
                }

                var wIdx = 0;
                function warmLoginBatch() {
                    if (wIdx >= monthsToWarm.length) return;
                    var batch = [];
                    while (batch.length < 2 && wIdx < monthsToWarm.length) {
                        batch.push(fetchNurseMonth(monthsToWarm[wIdx++]));
                    }
                    Promise.allSettled(batch).then(function() {
                        setTimeout(warmLoginBatch, 500);
                    });
                }
                setTimeout(warmLoginBatch, 800);

                return firstFetch;

            } else if (userType === 'driver') {
                var driverUrl = url + '?action=getPendingTrips';
                return fetch(driverUrl).then(function(r) { return r.json(); }).then(function(result) {
                    if (result && result.success && typeof DataCache !== 'undefined') {
                        DataCache.set('cache_pending_trips', result.trips || []);
                    }
                }).catch(function() {});
            } else if (userType === 'admin') {
                var adminUrl = url + '?action=getAdminData&year=' + year + '&month=' + month;
                var firstAdminFetch = fetch(adminUrl).then(function(r) { return r.json(); }).then(function(result) {
                    if (result && result.success && typeof DataCache !== 'undefined') {
                        DataCache.set('cache_admin_data', result);
                    }
                }).catch(function() {});

                // Also prefetch "all" and adjacent months' records for admin
                setTimeout(function() {
                    var adminMonths = [{ y: year, m: 'all' }];
                    if (month > 1) adminMonths.push({ y: year, m: month - 1 });
                    if (month < 12) adminMonths.push({ y: year, m: month + 1 });
                    for (var am = month - 2; am >= 1; am--) adminMonths.push({ y: year, m: am });
                    
                    var aIdx = 0;
                    function warmAdminLogin() {
                        if (aIdx >= adminMonths.length) return;
                        var itm = adminMonths[aIdx++];
                        var key = 'cache_records_' + itm.y + '_' + itm.m + '_';
                        if (typeof DataCache !== 'undefined') {
                            var ex = DataCache.get(key, 15 * 60 * 1000);
                            if (ex && ex.data) { setTimeout(warmAdminLogin, 100); return; }
                        }
                        var wUrl = url + '?action=getAllRecords&year=' + itm.y;
                        if (itm.m !== 'all') wUrl += '&month=' + itm.m;
                        fetch(wUrl).then(function(r) { return r.json(); }).then(function(result) {
                            if (result && result.success && result.data && typeof DataCache !== 'undefined') {
                                DataCache.set(key, result.data);
                            }
                        }).catch(function() {}).finally(function() { setTimeout(warmAdminLogin, 600); });
                    }
                    warmAdminLogin();
                }, 1000);

                return firstAdminFetch;
            }
            return Promise.resolve();
        }

        // Load saved credentials (Remember Me)
        function loadSavedCredentials() {
            const savedStaffNumber = localStorage.getItem('savedStaffNumber');
            if (savedStaffNumber) {
                document.getElementById('staffNumber').value = savedStaffNumber;
                document.getElementById('rememberMe').checked = true;
            }
        }

        // Check if app can be installed
        function checkInstallPrompt() {
            // Detect device type and update icon
            updateDeviceIcon();
            
            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                deferredPrompt = e;
                document.getElementById('installBtn').classList.add('show');
            });

            // Hide install button if already installed
            window.addEventListener('appinstalled', () => {
                document.getElementById('installBtn').classList.remove('show');
                deferredPrompt = null;
            });
        }

        // Detect device type and update install button icon
        function updateDeviceIcon() {
            const deviceIcon = document.getElementById('deviceIcon');
            const installText = document.getElementById('installText');
            const userAgent = navigator.userAgent.toLowerCase();
            
            if (/android/i.test(userAgent)) {
                // Android phone
                deviceIcon.textContent = '📱';
            } else if (/iphone|ipad|ipod/i.test(userAgent)) {
                // iOS device
                deviceIcon.textContent = '🍏';
            } else if (/windows/i.test(userAgent)) {
                // Windows PC
                deviceIcon.textContent = '💻';
            } else if (/macintosh|mac os x/i.test(userAgent)) {
                // Mac
                deviceIcon.textContent = '🖥️';
            } else if (/linux/i.test(userAgent)) {
                // Linux
                deviceIcon.textContent = '🖥️';
            } else {
                // Default
                deviceIcon.textContent = '📲';
            }
        }

        // Install app
        async function installApp() {
            if (!deferredPrompt) {
                alert(currentLang === 'ar' ? 'التطبيق مثبت بالفعل أو غير متاح للتثبيت' : 'App is already installed or not available for installation');
                return;
            }
            
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            
            if (outcome === 'accepted') {
                document.getElementById('installBtn').classList.remove('show');
            }
            deferredPrompt = null;
        }

        // Set language
        function setLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('appLanguage', lang);
            
            document.documentElement.lang = lang;
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            
            // Update manifest based on language
            const manifestLink = document.getElementById('app-manifest');
            if (manifestLink) {
                const timestamp = new Date().getTime();
                manifestLink.href = lang === 'ar' ? `manifest-ar.json?v=${timestamp}` : `manifest-en.json?v=${timestamp}`;
            }
            
            // Update language buttons
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.remove('active');
                if ((lang === 'ar' && btn.textContent === 'ع') || 
                    (lang === 'en' && btn.textContent === 'EN')) {
                    btn.classList.add('active');
                }
            });
            
            // Update text content
            document.querySelectorAll('[data-ar][data-en]').forEach(el => {
                el.innerHTML = el.getAttribute(`data-${lang}`);
            });
            
            // Update placeholders
            document.querySelectorAll('[data-placeholder-ar][data-placeholder-en]').forEach(el => {
                el.placeholder = el.getAttribute(`data-placeholder-${lang}`);
            });
        }

        /**
         * البحث عن المستخدم في بيانات السائقين والممرضين المحفوظة في localStorage
         * (المُضافة من صفحة الإعدادات). يدعم الدخول بالرقم الوظيفي أو المدني.
         */
        function findUserInLocalStorage(inputNumber) {
            // البحث في قائمة السائقين
            try {
                const drivers = JSON.parse(localStorage.getItem('ambulance_drivers')) || [];
                const driver = drivers.find(function(d) {
                    return d.staffNumber && d.staffNumber.toString() === inputNumber;
                });
                if (driver) {
                    return {
                        type: 'driver',
                        employeeType: driver.type || 'employee',
                        nameAr: driver.nameAr,
                        nameEn: driver.nameEn,
                        redirect: 'driver-interface.html'
                    };
                }
            } catch (e) { /* ignore parse errors */ }

            // البحث في قائمة الممرضين/ات
            try {
                const nurses = JSON.parse(localStorage.getItem('ambulance_nurses')) || [];
                const nurse = nurses.find(function(n) {
                    return n.staffNumber && n.staffNumber.toString() === inputNumber;
                });
                if (nurse) {
                    return {
                        type: 'nurse',
                        nameAr: nurse.nameAr,
                        nameEn: nurse.nameEn,
                        redirect: 'nurse-interface.html'
                    };
                }
            } catch (e) { /* ignore parse errors */ }

            return null;
        }

        // Handle login
        async function handleLogin(event) {
            event.preventDefault();
            
            const staffNumber = document.getElementById('staffNumber').value.trim();
            const loginBtn = document.getElementById('loginBtn');
            const errorMessage = document.getElementById('errorMessage');
            
            if (!staffNumber) {
                showError(currentLang === 'ar' ? 'يرجى إدخال الرقم الوظيفي أو المدني' : 'Please enter Staff Number or Civil ID');
                return;
            }
            
            // Show loading
            loginBtn.disabled = true;
            loginBtn.innerHTML = `<span>${currentLang === 'ar' ? 'جاري التحقق...' : 'Verifying...'}</span><span class="loading-spinner"></span>`;
            errorMessage.classList.remove('show');
            
            // Timeout to prevent stuck spinner (10 seconds)
            const timeoutId = setTimeout(() => {
                resetLoginButton();
                showError(currentLang === 'ar' ? 'انتهت مهلة الاتصال. يرجى المحاولة مرة أخرى' : 'Connection timeout. Please try again');
            }, 10000);
            
            try {
                // 1) Check in hardcoded users first
                let user = USERS[staffNumber];
                
                // 2) Check in localStorage drivers/nurses (added via Settings page)
                if (!user) {
                    user = findUserInLocalStorage(staffNumber);
                }
                
                // 3) Try to fetch from server API
                if (!user) {
                    try {
                        const controller = new AbortController();
                        const fetchTimeout = setTimeout(() => controller.abort(), 8000);
                        
                        const response = await fetch(`${WEB_APP_URL}?action=validateUser&staffNumber=${encodeURIComponent(staffNumber)}`, {
                            signal: controller.signal
                        });
                        clearTimeout(fetchTimeout);
                        
                        const result = await response.json();
                        if (result.success && result.user) {
                            user = result.user;
                        }
                    } catch (error) {
                        console.error('API error:', error);
                    }
                }
                
                clearTimeout(timeoutId);
                
                if (user) {
                    // Save credentials if Remember Me is checked
                    const rememberMe = document.getElementById('rememberMe').checked;
                    if (rememberMe) {
                        localStorage.setItem('savedStaffNumber', staffNumber);
                    } else {
                        localStorage.removeItem('savedStaffNumber');
                    }

                    // Store user session
                    const sessionData = {
                        id: user.id || '',
                        staffNumber: user.staffNumber || staffNumber,
                        civilId: user.civilId || '',
                        type: user.type,
                        employeeType: user.employeeType || 'employee',
                        nameAr: user.nameAr || '',
                        nameEn: user.nameEn || '',
                        vehicleNumber: user.vehicleNumber || '',
                        canAccessDriver: user.canAccessDriver || false,
                        canAccessNurse: user.canAccessNurse || false,
                        loginTime: new Date().toISOString(),
                        language: currentLang
                    };
                    
                    localStorage.setItem('userSession', JSON.stringify(sessionData));
                    localStorage.setItem('appLanguage', currentLang);
                    
                    // Pre-warm target page data before redirect
                    var prefetchDone = false;
                    try {
                        var firstFetch = prefetchForUserType(user.type, sessionData.staffNumber);
                        if (firstFetch && firstFetch.then) {
                            firstFetch.then(function() { prefetchDone = true; }).catch(function() {});
                        }
                    } catch(e) {}
                    
                    // Prefetch target page HTML so browser has it cached
                    try {
                        var link = document.createElement('link');
                        link.rel = 'prefetch';
                        link.href = user.redirect;
                        document.head.appendChild(link);
                    } catch(e) {}
                    
                    // Wait for first data fetch to complete (up to 600ms max)
                    // This ensures the target page has data in cache on arrival
                    var redirectTimer = setTimeout(function() {
                        window.location.href = user.redirect;
                    }, 600);
                    if (firstFetch && firstFetch.then) {
                        firstFetch.then(function() {
                            clearTimeout(redirectTimer);
                            setTimeout(function() { window.location.href = user.redirect; }, 50);
                        }).catch(function() {});
                    }
                } else {
                    // User not found
                    resetLoginButton();
                    showError(currentLang === 'ar' ? 'الرقم الوظيفي أو المدني غير مسجل في النظام' : 'Staff number or Civil ID not registered in the system');
                }
            } catch (error) {
                clearTimeout(timeoutId);
                resetLoginButton();
                showError(currentLang === 'ar' ? 'حدث خطأ. يرجى المحاولة مرة أخرى' : 'An error occurred. Please try again');
            }
        }
        
        function resetLoginButton() {
            const loginBtn = document.getElementById('loginBtn');
            loginBtn.disabled = false;
            loginBtn.innerHTML = `<span data-ar="تسجيل الدخول" data-en="Login">${currentLang === 'ar' ? 'تسجيل الدخول' : 'Login'}</span>`;
        }

        // Show error message
        function showError(message) {
            const errorMessage = document.getElementById('errorMessage');
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
        }

        // Register Service Worker for PWA with auto-update
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js')
                .then(reg => {
                    console.log('[App] Service Worker registered successfully');
                    
                    // Check for updates every 60 seconds
                    setInterval(() => {
                        reg.update();
                    }, 60000);
                    
                    // Listen for updates
                    reg.addEventListener('updatefound', () => {
                        const newWorker = reg.installing;
                        console.log('[App] New Service Worker found, installing...');
                        
                        newWorker.addEventListener('statechange', () => {
                            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                console.log('[App] New version available! Reloading...');
                                // Auto-reload to get the new version
                                setTimeout(() => window.location.reload(), 1000);
                            }
                        });
                    });
                })
                .catch(err => console.error('[App] Service Worker registration failed:', err));
            
            // Listen for messages from Service Worker
            navigator.serviceWorker.addEventListener('message', event => {
                if (event.data && event.data.type === 'SW_UPDATED') {
                    console.log('[App] ' + event.data.message);
                    window.location.reload();
                }
            });
        }
    </script>
