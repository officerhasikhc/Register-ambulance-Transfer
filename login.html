    <style>
        :root {
            --primary-blue: #1e40af;
            --light-blue:   #2563eb;
            --lighter-blue: #eff6ff;
            --dark-blue:    #0f2748;
            --accent-red:   #c0392b;
            --white:        #ffffff;
            --text-primary:   #1a2333;
            --text-secondary: #6b7280;
            --border-color:   #d1d5db;
            --success: #10b981;
            --warning: #f59e0b;
            --error:   #ef4444;
            --shadow-xl: 0 20px 50px rgba(0,0,0,0.22), 0 4px 16px rgba(0,0,0,0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Cairo', 'IBM Plex Sans Arabic', sans-serif;
            background: linear-gradient(160deg, #0f2748 0%, #1a3d7c 45%, #1e55b5 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text-primary);
        }

        [dir="ltr"] body {
            font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        /* ── Card ─────────────────────────────────────────── */
        .login-container {
            background: var(--white);
            border-radius: 16px;
            padding: 0;
            width: 100%;
            max-width: 420px;
            box-shadow: var(--shadow-xl);
            position: relative;
            overflow: hidden;
        }

        /* Omani accent stripe at top */
        .login-container::before {
            content: '';
            display: block;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, #c0392b 30%, #ffffff 50%, #1a7a3c 70%);
        }

        .login-inner {
            padding: 36px 40px 32px;
        }

        /* ── Header ───────────────────────────────────────── */
        .login-header {
            text-align: center;
            margin-bottom: 28px;
            margin-top: 14px;
        }

        .login-logo {
            width: 76px;
            height: 76px;
            object-fit: contain;
            margin: 0 auto 14px auto;
            display: block;
        }

        .login-org-name {
            color: #1a2333;
            font-size: 14px;
            font-weight: 700;
            line-height: 1.8;
            margin-bottom: 10px;
        }

        .login-divider {
            width: 48px;
            height: 2px;
            background: var(--primary-blue);
            margin: 10px auto;
            border-radius: 2px;
            opacity: 0.4;
        }

        .login-system-name {
            color: #1e3a8a;
            font-size: 13.5px;
            font-weight: 700;
            padding: 6px 18px;
            margin-top: 10px;
            background: #eef2ff;
            border: 1.5px solid #c7d2fe;
            border-radius: 6px;
            display: inline-block;
            letter-spacing: 0.3px;
        }

        /* ── Language Switch ──────────────────────────────── */
        .lang-switch {
            position: absolute;
            top: 14px;
            right: 14px;
            display: flex;
            gap: 3px;
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            padding: 3px;
            border-radius: 8px;
            z-index: 10;
        }

        [dir="ltr"] .lang-switch { right: auto; left: 14px; }

        .lang-btn {
            padding: 5px 11px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-weight: 700;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.18s;
            font-size: 11px;
            font-family: inherit;
            min-width: 34px;
        }

        .lang-btn.active {
            background: var(--primary-blue);
            color: var(--white);
            box-shadow: 0 1px 4px rgba(30,64,175,0.3);
        }

        .lang-btn:hover:not(.active) { background: #e2e8f0; }

        /* ── Form ─────────────────────────────────────────── */
        .form-group { margin-bottom: 18px; }

        .form-label {
            display: block;
            margin-bottom: 7px;
            font-weight: 700;
            color: #374151;
            font-size: 13px;
        }

        .input-with-icon { position: relative; }

        .input-icon {
            position: absolute;
            top: 50%;
            right: 14px;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            color: #9ca3af;
            pointer-events: none;
            transition: color 0.2s;
        }

        [dir="ltr"] .input-icon { right: auto; left: 14px; }

        .input-with-icon .form-input { padding-right: 44px; }

        [dir="ltr"] .input-with-icon .form-input { padding-right: 14px; padding-left: 44px; }

        .input-with-icon:focus-within .input-icon { color: var(--primary-blue); }

        .form-input {
            width: 100%;
            padding: 13px 14px;
            border: 1.5px solid #d1d5db;
            border-radius: 9px;
            font-size: 15px;
            font-family: inherit;
            transition: all 0.2s;
            background: #fafafa;
            color: var(--text-primary);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary-blue);
            background: var(--white);
            box-shadow: 0 0 0 3px rgba(30,64,175,0.1);
        }

        .form-input::placeholder { color: #b0b7c3; }

        /* ── Remember Me ──────────────────────────────────── */
        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 18px;
        }

        .remember-me input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--primary-blue);
            cursor: pointer;
        }

        .remember-me label {
            font-size: 13px;
            color: var(--text-secondary);
            cursor: pointer;
        }

        /* ── Login Button ─────────────────────────────────── */
        .login-btn {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #1e40af, #2563eb);
            color: var(--white);
            border: none;
            border-radius: 9px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.22s ease;
            font-family: inherit;
            letter-spacing: 0.3px;
            box-shadow: 0 3px 12px rgba(30,64,175,0.3);
        }

        .login-btn:hover {
            background: linear-gradient(135deg, #1e3a8a, #1d4ed8);
            transform: translateY(-1px);
            box-shadow: 0 5px 16px rgba(30,64,175,0.4);
        }

        .login-btn:active {
            transform: translateY(0);
            box-shadow: 0 2px 8px rgba(30,64,175,0.25);
        }

        .login-btn:disabled {
            cursor: not-allowed;
            transform: none;
            opacity: 0.75;
            box-shadow: none;
        }

        /* ── Error ────────────────────────────────────────── */
        .error-message {
            background: #fef2f2;
            color: #dc2626;
            border: 1px solid #fecaca;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 13px;
            display: none;
        }

        .error-message.show { display: block; }

        /* ── Install Button ───────────────────────────────── */
        .install-container {
            text-align: center;
            margin-top: 18px;
            display: none; /* hidden until PWA is installable */
        }

        .install-container.visible { display: block; }

        .install-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 18px;
            background: #f0f4ff;
            color: #3730a3;
            border: 1.5px solid #c7d2fe;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .install-btn:hover {
            background: #e0e7ff;
            border-color: #a5b4fc;
            transform: translateY(-1px);
        }

        .install-btn .device-icon { font-size: 14px; }

        /* ── Footer ───────────────────────────────────────── */
        .footer-text {
            text-align: center;
            margin-top: 20px;
            color: #9ca3af;
            font-size: 11px;
        }

        /* ── Spinner ──────────────────────────────────────── */
        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.35);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            margin-left: 8px;
            vertical-align: middle;
        }

        [dir="ltr"] .loading-spinner { margin-left: 0; margin-right: 8px; }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Mobile ───────────────────────────────────────── */
        @media (max-width: 480px) {
            body { padding: 10px; align-items: flex-start; padding-top: 30px; }

            .login-container { border-radius: 20px; max-width: 100%; }

            .login-inner { padding: 28px 24px 28px; }

            .login-logo { width: 96px; height: 96px; margin-bottom: 16px; }

            .login-header { margin-bottom: 30px; margin-top: 12px; }

            .login-org-name { font-size: 15px; }

            .login-system-name { font-size: 13.5px; }

            .form-label { font-size: 14px; }

            .form-input { padding: 14px 16px; font-size: 16px; border-radius: 10px; }

            .form-group { margin-bottom: 20px; }

            .remember-me { margin-bottom: 20px; }
            .remember-me input[type="checkbox"] { width: 18px; height: 18px; }
            .remember-me label { font-size: 14px; }

            .login-btn { padding: 15px; font-size: 17px; border-radius: 11px; }

            .footer-text { font-size: 12px; margin-top: 24px; }

            .lang-switch { top: 12px; right: 12px; }
            [dir="ltr"] .lang-switch { left: 12px; }
            .lang-btn { padding: 6px 12px; font-size: 12px; }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="lang-switch">
            <button class="lang-btn active" onclick="setLanguage('ar')">ع</button>
            <button class="lang-btn" onclick="setLanguage('en')">EN</button>
        </div>

        <div class="login-inner">

            <div class="login-header">
                <img src="moh-logo.png" alt="Logo" class="login-logo">
                <p class="login-org-name" data-ar="المديرية العامة للخدمات الصحية بمحافظة ظفار<br>مركز حاسك الصحي" data-en="Directorate General of Health Services - Dhofar<br>Hasik Health Center">المديرية العامة للخدمات الصحية بمحافظة ظفار<br>مركز حاسك الصحي</p>
                <div class="login-divider"></div>
                <div class="login-system-name" data-ar="نظام سجل نشاط الإسعاف" data-en="Ambulance Activity Record System">نظام سجل نشاط الإسعاف</div>
            </div>

            <div class="error-message" id="errorMessage"></div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label class="form-label" data-ar="الرقم الوظيفي أو المدني" data-en="Staff Number">الرقم الوظيفي أو المدني</label>
                    <div class="input-with-icon">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                        </svg>
                        <input type="text" class="form-input" id="staffNumber"
                               placeholder="أدخل الرقم الوظيفي أو المدني"
                               data-placeholder-ar="أدخل الرقم الوظيفي أو المدني"
                               data-placeholder-en="Enter Staff Number"
                               required autocomplete="off">
                    </div>
                </div>

                <div class="remember-me">
                    <input type="checkbox" id="rememberMe" checked>
                    <label for="rememberMe" data-ar="تذكرني" data-en="Remember me">تذكرني</label>
                </div>

                <button type="submit" class="login-btn" id="loginBtn">
                    <span data-ar="تسجيل الدخول" data-en="Login">تسجيل الدخول</span>
                </button>
            </form>

            <div class="install-container" id="installContainer">
                <button class="install-btn" id="installBtn" onclick="installApp()">
                    <span class="device-icon" id="deviceIcon">📲</span>
                    <span data-ar="تثبيت التطبيق" data-en="Install App" id="installText">تثبيت التطبيق</span>
                </button>
            </div>

            <p class="footer-text" data-ar="© 2026 مركز حاسك الصحي — جميع الحقوق محفوظة" data-en="© 2026 Hasik Health Center — All Rights Reserved">© 2026 مركز حاسك الصحي — جميع الحقوق محفوظة</p>

        </div><!-- /.login-inner -->
    </div>

    <script>
        // Configuration
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwDUAGlnGBKZMhq8UbzEYBUaP3UNi49Be5PdwqQfnyIiB1HomgXVLrmUTrgeLKhyb-j/exec';
        
        let currentLang = localStorage.getItem('appLanguage') || 'ar';

        // Users Database (will be loaded from Google Sheets)
        const USERS = {
            // Admin - has access to all pages
            '65886': { 
                type: 'admin', 
                nameAr: 'عبدالباقي عبدالهادي مرزوق بيت مروس', 
                nameEn: 'Abdulbaqi Abdulhadi Marzouq Bait Marous',
                redirect: 'admin-interface.html',
                canAccessDriver: true,
                canAccessNurse: true
            },
            // Nurses
            '79470': { 
                type: 'nurse', 
                nameAr: 'ميتي ماثيو', 
                nameEn: 'Metty Mathew',
                redirect: 'nurse-interface.html'
            },
            '62971': { 
                type: 'nurse', 
                nameAr: 'شيرين كوريان', 
                nameEn: 'Sherine Kurian',
                redirect: 'nurse-interface.html'
            },
            '85181': { 
                type: 'nurse', 
                nameAr: 'ساميني ثانكاموني', 
                nameEn: 'Samini Thankamony',
                redirect: 'nurse-interface.html'
            },
            '88973': { 
                type: 'nurse', 
                nameAr: 'آنو ماموتيل', 
                nameEn: 'Annu Mamootel',
                redirect: 'nurse-interface.html'
            },
            '57609': { 
                type: 'nurse', 
                nameAr: 'عائشة سعيد بخيت السليمي', 
                nameEn: 'Aisha Said Bakhit Al-Sulaimi',
                redirect: 'nurse-interface.html'
            },
            // Drivers
            '39121': { 
                type: 'driver', 
                employeeType: 'employee',
                nameAr: 'سعد زايد الجنيبي', 
                nameEn: 'SAAD ZAID AL-JUNAIBI',
                redirect: 'inspection-interface.html'
            },
            '22975657': { 
                type: 'driver', 
                employeeType: 'daily-paid',
                nameAr: 'حسان ثابت رجب', 
                nameEn: 'HASSAN THABIT RAJAB',
                redirect: 'inspection-interface.html'
            },
            '39634': { 
                type: 'driver', 
                employeeType: 'employee',
                nameAr: 'محمد الرضه علي', 
                nameEn: 'MOHAMMED AL-RUDHA ALI',
                redirect: 'inspection-interface.html'
            },
            '65870': { 
                type: 'driver', 
                employeeType: 'employee',
                nameAr: 'عبدالعزيز مسلم النقش', 
                nameEn: 'ABDULAZIZ MUSALLEM AL-NAQSH',
                redirect: 'inspection-interface.html'
            },
            '41299': { 
                type: 'nurse', 
                nameAr: 'بخيت محمد الغفيلي المهري', 
                nameEn: 'Bakhit Mohamed Al-Ghufaili Al-Mahri',
                redirect: 'nurse-interface.html'
            }
        };

        // ============================================
        // SYNC USERS FROM SERVER | مزامنة المستخدمين من الخادم
        // ============================================
        
        /**
         * Fetch users from server and update local USERS object
         * This ensures hardcoded users are always up to date
         */
        async function syncUsersFromServer() {
            try {
                const response = await fetch(`${WEB_APP_URL}?action=getAllUsers`);
                const result = await response.json();
                if (result.success && result.users) {
                    result.users.forEach(function(user) {
                        if (!user.active) return;
                        
                        // Determine login key: staffNumber or civilId
                        const loginKey = user.staffNumber || user.civilId;
                        if (!loginKey) return;
                        
                        // Determine employee type
                        const hasStaff = user.staffNumber && user.staffNumber.toString().trim() !== '';
                        const hasCivil = user.civilId && user.civilId.toString().trim() !== '';
                        const employeeType = (!hasStaff && hasCivil) ? 'daily-paid' : 'employee';
                        
                        // Determine redirect page
                        let redirect = 'driver-interface.html';
                        if (user.type === 'admin') redirect = 'admin-interface.html';
                        else if (user.type === 'nurse') redirect = 'nurse-interface.html';
                        else if (user.type === 'driver') redirect = 'inspection-interface.html';
                        
                        // Update USERS object (overrides hardcoded)
                        USERS[loginKey] = {
                            type: user.type,
                            employeeType: employeeType,
                            nameAr: user.nameAr,
                            nameEn: user.nameEn,
                            redirect: redirect
                        };
                        
                        // Also index by the other number if exists
                        if (user.staffNumber && user.civilId) {
                            USERS[user.civilId] = USERS[loginKey];
                        }
                    });
                    console.log('[Login] Users synced from server:', Object.keys(USERS).length);
                }
            } catch (error) {
                console.log('[Login] Server sync failed, using hardcoded users:', error);
            }
        }

        // PWA Install prompt
        let deferredPrompt;

        // Capture beforeinstallprompt early — it can fire before DOMContentLoaded
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            const container = document.getElementById('installContainer');
            if (container) container.classList.add('visible');
        });

        // Fired after user installs via the prompt — hide button immediately
        window.addEventListener('appinstalled', () => {
            const container = document.getElementById('installContainer');
            if (container) container.classList.remove('visible');
            deferredPrompt = null;
        });

        // Initialize
        document.addEventListener('DOMContentLoaded', async function() {
            setLanguage(currentLang);
            loadSavedCredentials();
            checkInstallPrompt();
            
            // Sync users from server first (before any login attempt)
            await syncUsersFromServer();
            
            prefetchOnPageLoad();

            // Speculative prefetch: when user types a known staff number, start loading data early
            var specPrefetchDone = {};
            var specDebounce = null;
            document.getElementById('staffNumber').addEventListener('input', function() {
                var val = this.value.trim();
                if (val.length < 3 || specPrefetchDone[val]) return;
                clearTimeout(specDebounce);
                specDebounce = setTimeout(function() {
                    var user = USERS[val] || findUserInLocalStorage(val);
                    if (user && !specPrefetchDone[val]) {
                        specPrefetchDone[val] = true;
                        prefetchForUserType(user.type, val);
                        // Prefetch target page HTML
                        try {
                            var link = document.createElement('link');
                            link.rel = 'prefetch';
                            link.href = user.redirect;
                            document.head.appendChild(link);
                        } catch(e) {}
                    }
                }, 300);
            });
        });

        // Listen for cross-tab user updates (when settings page updates a user)
        window.addEventListener('storage', function(e) {
            if (e.key === 'users_updated_ts') {
                console.log('[Login] Users updated in another tab, re-syncing...');
                syncUsersFromServer();
            }
        });

        /**
         * SMART PRE-WARMING: Start fetching data BEFORE user clicks login
         * If user has a saved session or saved staff number, we know their type
         * and can prefetch their full page data immediately on login page load.
         */
        function prefetchOnPageLoad() {
            try {
                // Check existing session first (user refreshed/returned)
                var session = null;
                try { session = JSON.parse(localStorage.getItem('userSession') || 'null'); } catch(e) {}
                
                if (session && session.type) {
                    prefetchForUserType(session.type, session.staffNumber || '');
                    return;
                }
                
                // Check saved staff number (Remember Me) — look up user type
                var savedNum = localStorage.getItem('savedStaffNumber');
                if (savedNum) {
                    var user = USERS[savedNum] || findUserInLocalStorage(savedNum);
                    if (user) {
                        prefetchForUserType(user.type, savedNum);
                    }
                }
            } catch(e) { console.warn('Prefetch on load error (non-fatal):', e); }
        }

        /**
         * Prefetch full page data based on user type.
         * Stores in DataCache localStorage so target page loads instantly.
         * Returns a Promise that resolves when the FIRST (highest priority) fetch completes.
         */
        function prefetchForUserType(userType, staffNumber) {
            var url = WEB_APP_URL;
            var year = new Date().getFullYear();
            var month = new Date().getMonth() + 1;
            
            if (userType === 'nurse') {
                // Fast fetch: lightweight pending trips ONLY (1-2s) — returned as firstFetch so login waits for it
                var firstFetch = fetch(url + '?action=getPendingTrips').then(function(r) { return r.json(); }).then(function(result) {
                    if (result && result.success && Array.isArray(result.trips)) {
                        try {
                            var nt = result.trips.filter(function(t) { return t.status !== 'submitted'; });
                            localStorage.setItem('pending_trips_for_nurse', JSON.stringify({ trips: nt, ts: Date.now() }));
                        } catch(e) {}
                    }
                }).catch(function() {});

                // Heavy fetch: full nurse data (records + trips + stats) — runs in background
                var nurseUrl = url + '?action=getNurseData&year=' + year + '&month=' + month;
                if (staffNumber) nurseUrl += '&staffNumber=' + encodeURIComponent(staffNumber);
                fetch(nurseUrl).then(function(r) { return r.json(); }).then(function(result) {
                    if (result && result.success && typeof DataCache !== 'undefined') {
                        DataCache.set('cache_nurse_data_' + year + '_' + month, result);
                    }
                    if (result && result.trips) {
                        try {
                            var nurseTrips = result.trips.filter(function(t) { return t.status !== 'submitted'; });
                            localStorage.setItem('pending_trips_for_nurse', JSON.stringify({ trips: nurseTrips, ts: Date.now() }));
                        } catch(e) {}
                    }
                }).catch(function() {});

                // Phase 2: "all" + adjacent months + rest (parallel batches, faster intervals)
                var monthsToWarm = [];
                monthsToWarm.push({ y: year, m: 'all' });
                if (month > 1) monthsToWarm.push({ y: year, m: month - 1 });
                if (month < 12) monthsToWarm.push({ y: year, m: month + 1 });
                for (var m = month - 2; m >= 1; m--) monthsToWarm.push({ y: year, m: m });
                for (var m2 = month + 2; m2 <= 12; m2++) monthsToWarm.push({ y: year, m: m2 });
                var prevYear = year - 1;
                for (var pm = 12; pm >= 1; pm--) monthsToWarm.push({ y: prevYear, m: pm });

                function fetchNurseMonth(item) {
                    var key = 'cache_nurse_data_' + item.y + '_' + item.m;
                    if (typeof DataCache !== 'undefined') {
                        var existing = DataCache.get(key, 15 * 60 * 1000);
                        if (existing && existing.data && !existing.isExpired) return Promise.resolve();
                    }
                    var warmUrl = url + '?action=getNurseData&year=' + item.y;
                    if (item.m !== 'all') warmUrl += '&month=' + item.m;
                    if (staffNumber) warmUrl += '&staffNumber=' + encodeURIComponent(staffNumber);
                    return fetch(warmUrl).then(function(r) { return r.json(); }).then(function(result) {
                        if (result && result.success && typeof DataCache !== 'undefined') {
                            DataCache.set(key, result);
                        }
                    }).catch(function() {});
                }

                var wIdx = 0;
                function warmLoginBatch() {
                    if (wIdx >= monthsToWarm.length) return;
                    var batch = [];
                    while (batch.length < 2 && wIdx < monthsToWarm.length) {
                        batch.push(fetchNurseMonth(monthsToWarm[wIdx++]));
                    }
                    Promise.allSettled(batch).then(function() {
                        setTimeout(warmLoginBatch, 500);
                    });
                }
                setTimeout(warmLoginBatch, 800);

                return firstFetch;

            } else if (userType === 'driver') {
                var driverUrl = url + '?action=getPendingTrips';
                return fetch(driverUrl).then(function(r) { return r.json(); }).then(function(result) {
                    if (result && result.success && typeof DataCache !== 'undefined') {
                        DataCache.set('cache_pending_trips', result.trips || []);
                    }
                }).catch(function() {});
            } else if (userType === 'admin') {
                // Fast fetch: lightweight pending trips ONLY (1-2s) — returned as firstFetch so login waits for it
                var firstAdminFetch = fetch(url + '?action=getPendingTrips').then(function(r) { return r.json(); }).then(function(result) {
                    if (result && result.success && Array.isArray(result.trips)) {
                        try { localStorage.setItem('cache_pending_trips', JSON.stringify({ data: result.trips, ts: Date.now() })); } catch(e) {}
                    }
                }).catch(function() {});

                // Heavy fetch: full admin data (stats + records + trips) — runs in background
                var adminUrl = url + '?action=getAdminData&year=' + year + '&month=' + month;
                fetch(adminUrl).then(function(r) { return r.json(); }).then(function(result) {
                    if (result && result.success) {
                        try { localStorage.setItem('admin_instant_data', JSON.stringify(result)); } catch(e) {}
                        if (typeof DataCache !== 'undefined') {
                            DataCache.set('cache_admin_data', result);
                        }
                    }
                }).catch(function() {});

                // Also prefetch "all" and adjacent months' records for admin
                setTimeout(function() {
                    var adminMonths = [{ y: year, m: 'all' }];
                    if (month > 1) adminMonths.push({ y: year, m: month - 1 });
                    if (month < 12) adminMonths.push({ y: year, m: month + 1 });
                    for (var am = month - 2; am >= 1; am--) adminMonths.push({ y: year, m: am });
                    
                    var aIdx = 0;
                    function warmAdminLogin() {
                        if (aIdx >= adminMonths.length) return;
                        var itm = adminMonths[aIdx++];
                        var key = 'cache_records_' + itm.y + '_' + itm.m + '_';
                        if (typeof DataCache !== 'undefined') {
                            var ex = DataCache.get(key, 15 * 60 * 1000);
                            if (ex && ex.data) { setTimeout(warmAdminLogin, 100); return; }
                        }
                        var wUrl = url + '?action=getAllRecords&year=' + itm.y;
                        if (itm.m !== 'all') wUrl += '&month=' + itm.m;
                        fetch(wUrl).then(function(r) { return r.json(); }).then(function(result) {
                            if (result && result.success && result.data && typeof DataCache !== 'undefined') {
                                DataCache.set(key, result.data);
                            }
                        }).catch(function() {}).finally(function() { setTimeout(warmAdminLogin, 600); });
                    }
                    warmAdminLogin();
                }, 1000);

                return firstAdminFetch;
            }
            return Promise.resolve();
        }

        // Load saved credentials (Remember Me)
        function loadSavedCredentials() {
            const savedStaffNumber = localStorage.getItem('savedStaffNumber');
            if (savedStaffNumber) {
                document.getElementById('staffNumber').value = savedStaffNumber;
                document.getElementById('rememberMe').checked = true;
            }
        }

        // Smart PWA install detection — works on ALL browsers
        function checkInstallPrompt() {
            const container = document.getElementById('installContainer');

            // If already running as installed PWA (standalone mode) → never show
            const isStandalone = window.matchMedia('(display-mode: standalone)').matches
                              || window.navigator.standalone === true;
            if (isStandalone) {
                container.style.display = 'none';
                return;
            }

            // Update device icon based on platform
            updateDeviceIcon();

            // If beforeinstallprompt already fired (Chrome/Edge/Samsung Internet 14+), show native install
            if (deferredPrompt) {
                container.classList.add('visible');
                return;
            }

            // For ALL other browsers: show install button with manual instructions
            // This covers: Huawei Browser, Firefox, Opera, Samsung Internet (old), UC Browser, etc.
            const textEl = document.getElementById('installText');
            const iconEl = document.getElementById('deviceIcon');
            const browserInfo = detectBrowser();

            if (browserInfo.name === 'ios-safari') {
                iconEl.textContent = '🍏';
                textEl.setAttribute('data-ar', 'أضف للشاشة الرئيسية');
                textEl.setAttribute('data-en', 'Add to Home Screen');
                textEl.textContent = currentLang === 'ar' ? 'أضف للشاشة الرئيسية' : 'Add to Home Screen';
            } else {
                textEl.setAttribute('data-ar', 'تثبيت التطبيق');
                textEl.setAttribute('data-en', 'Install App');
                textEl.textContent = currentLang === 'ar' ? 'تثبيت التطبيق' : 'Install App';
            }
            container.classList.add('visible');
        }

        // Detect browser engine for install instructions
        function detectBrowser() {
            const ua = navigator.userAgent;
            if (/iphone|ipad|ipod/i.test(ua) && /safari/i.test(ua) && !/crios|fxios|chrome/i.test(ua))
                return { name: 'ios-safari' };
            if (/HuaweiBrowser/i.test(ua) || /HUAWEI/i.test(ua) && !/Chrome/i.test(ua))
                return { name: 'huawei' };
            if (/Firefox/i.test(ua) && !/Seamonkey/i.test(ua))
                return { name: 'firefox' };
            if (/SamsungBrowser/i.test(ua))
                return { name: 'samsung' };
            if (/OPR|Opera/i.test(ua))
                return { name: 'opera' };
            if (/UCBrowser/i.test(ua))
                return { name: 'uc' };
            if (/Edg/i.test(ua))
                return { name: 'edge' };
            if (/Chrome/i.test(ua))
                return { name: 'chrome' };
            return { name: 'other' };
        }

        // Detect device type and update install button icon
        function updateDeviceIcon() {
            const deviceIcon = document.getElementById('deviceIcon');
            const ua = navigator.userAgent;
            if (/android/i.test(ua))              deviceIcon.textContent = '📱';
            else if (/iphone|ipad|ipod/i.test(ua)) deviceIcon.textContent = '🍏';
            else if (/windows/i.test(ua))          deviceIcon.textContent = '💻';
            else                                   deviceIcon.textContent = '📲';
        }

        // Install app — works on ALL browsers
        async function installApp() {
            // If native prompt is available (Chrome/Edge), use it
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    document.getElementById('installContainer').classList.remove('visible');
                }
                deferredPrompt = null;
                return;
            }

            // Otherwise show manual instructions based on browser
            const browser = detectBrowser();
            let msgAr, msgEn;

            switch (browser.name) {
                case 'ios-safari':
                    msgAr = '📲 لتثبيت التطبيق:\n\n1. اضغط على زر المشاركة ⬆️ في الأسفل\n2. اختر "إضافة إلى الشاشة الرئيسية"\n3. اضغط "إضافة"';
                    msgEn = '📲 To install:\n\n1. Tap the Share button ⬆️ at the bottom\n2. Choose "Add to Home Screen"\n3. Tap "Add"';
                    break;
                case 'huawei':
                    msgAr = '📲 لتثبيت التطبيق:\n\n1. اضغط على ⋮ (ثلاث نقاط) أعلى المتصفح\n2. اختر "إضافة إلى الشاشة الرئيسية"\n3. اضغط "إضافة"';
                    msgEn = '📲 To install:\n\n1. Tap ⋮ (three dots) at the top\n2. Choose "Add to Home Screen"\n3. Tap "Add"';
                    break;
                case 'firefox':
                    msgAr = '📲 لتثبيت التطبيق:\n\n1. اضغط على ⋮ (ثلاث نقاط) أعلى المتصفح\n2. اختر "تثبيت" أو "إضافة إلى الشاشة الرئيسية"';
                    msgEn = '📲 To install:\n\n1. Tap ⋮ (three dots) at the top\n2. Choose "Install" or "Add to Home Screen"';
                    break;
                case 'samsung':
                    msgAr = '📲 لتثبيت التطبيق:\n\n1. اضغط على ☰ (ثلاثة خطوط) أسفل المتصفح\n2. اختر "إضافة الصفحة إلى"\n3. اختر "الشاشة الرئيسية"';
                    msgEn = '📲 To install:\n\n1. Tap ☰ (three lines) at the bottom\n2. Choose "Add page to"\n3. Choose "Home screen"';
                    break;
                case 'opera':
                    msgAr = '📲 لتثبيت التطبيق:\n\n1. اضغط على ⋮ (ثلاث نقاط) أسفل المتصفح\n2. اختر "الشاشة الرئيسية" أو "Add to Home Screen"';
                    msgEn = '📲 To install:\n\n1. Tap ⋮ at the bottom\n2. Choose "Home screen" or "Add to Home Screen"';
                    break;
                default:
                    msgAr = '📲 لتثبيت التطبيق:\n\n1. افتح قائمة المتصفح ⋮\n2. اختر "إضافة إلى الشاشة الرئيسية" أو "تثبيت التطبيق"';
                    msgEn = '📲 To install:\n\n1. Open browser menu ⋮\n2. Choose "Add to Home Screen" or "Install App"';
                    break;
            }

            alert(currentLang === 'ar' ? msgAr : msgEn);
        }

        // Set language
        function setLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('appLanguage', lang);
            
            document.documentElement.lang = lang;
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            
            // Update manifest based on language
            const manifestLink = document.getElementById('app-manifest');
            if (manifestLink) {
                const timestamp = new Date().getTime();
                manifestLink.href = lang === 'ar' ? `manifest-ar.json?v=${timestamp}` : `manifest-en.json?v=${timestamp}`;
            }
            
            // Update language buttons
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.remove('active');
                if ((lang === 'ar' && btn.textContent === 'ع') || 
                    (lang === 'en' && btn.textContent === 'EN')) {
                    btn.classList.add('active');
                }
            });
            
            // Update text content
            document.querySelectorAll('[data-ar][data-en]').forEach(el => {
                el.innerHTML = el.getAttribute(`data-${lang}`);
            });
            
            // Update placeholders
            document.querySelectorAll('[data-placeholder-ar][data-placeholder-en]').forEach(el => {
                el.placeholder = el.getAttribute(`data-placeholder-${lang}`);
            });
        }

        /**
         * البحث عن المستخدم في بيانات السائقين والممرضين المحفوظة في localStorage
         * (المُضافة من صفحة الإعدادات). يدعم الدخول بالرقم الوظيفي أو المدني.
         */
        function findUserInLocalStorage(inputNumber) {
            // البحث في قائمة السائقين
            try {
                const drivers = JSON.parse(localStorage.getItem('ambulance_drivers')) || [];
                const driver = drivers.find(function(d) {
                    return d.staffNumber && d.staffNumber.toString() === inputNumber;
                });
                if (driver) {
                    return {
                        type: 'driver',
                        employeeType: driver.type || 'employee',
                        nameAr: driver.nameAr,
                        nameEn: driver.nameEn,
                        redirect: 'inspection-interface.html'
                    };
                }
            } catch (e) { /* ignore parse errors */ }

            // البحث في قائمة الممرضين/ات
            try {
                const nurses = JSON.parse(localStorage.getItem('ambulance_nurses')) || [];
                const nurse = nurses.find(function(n) {
                    return n.staffNumber && n.staffNumber.toString() === inputNumber;
                });
                if (nurse) {
                    return {
                        type: 'nurse',
                        nameAr: nurse.nameAr,
                        nameEn: nurse.nameEn,
                        redirect: 'nurse-interface.html'
                    };
                }
            } catch (e) { /* ignore parse errors */ }

            return null;
        }

        // Handle login
        async function handleLogin(event) {
            event.preventDefault();
            
            const staffNumber = document.getElementById('staffNumber').value.trim();
            const loginBtn = document.getElementById('loginBtn');
            const errorMessage = document.getElementById('errorMessage');
            
            if (!staffNumber) {
                showError(currentLang === 'ar' ? 'يرجى إدخال الرقم الوظيفي أو المدني' : 'Please enter Staff Number or Civil ID');
                return;
            }
            
            // Show loading
            loginBtn.disabled = true;
            loginBtn.innerHTML = `<span>${currentLang === 'ar' ? 'جاري التحقق...' : 'Verifying...'}</span><span class="loading-spinner"></span>`;
            errorMessage.classList.remove('show');
            
            // Timeout to prevent stuck spinner (10 seconds)
            const timeoutId = setTimeout(() => {
                resetLoginButton();
                showError(currentLang === 'ar' ? 'انتهت مهلة الاتصال. يرجى المحاولة مرة أخرى' : 'Connection timeout. Please try again');
            }, 10000);
            
            try {
                // 1) Check in hardcoded users first
                let user = USERS[staffNumber];
                
                // 2) Check in localStorage drivers/nurses (added via Settings page)
                if (!user) {
                    user = findUserInLocalStorage(staffNumber);
                }
                
                // 3) Try to fetch from server API
                if (!user) {
                    try {
                        const controller = new AbortController();
                        const fetchTimeout = setTimeout(() => controller.abort(), 8000);
                        
                        const response = await fetch(`${WEB_APP_URL}?action=validateUser&staffNumber=${encodeURIComponent(staffNumber)}`, {
                            signal: controller.signal
                        });
                        clearTimeout(fetchTimeout);
                        
                        const result = await response.json();
                        if (result.success && result.user) {
                            user = result.user;
                        }
                    } catch (error) {
                        console.error('API error:', error);
                    }
                }
                
                clearTimeout(timeoutId);
                
                if (user) {
                    // Save credentials if Remember Me is checked
                    const rememberMe = document.getElementById('rememberMe').checked;
                    if (rememberMe) {
                        localStorage.setItem('savedStaffNumber', staffNumber);
                    } else {
                        localStorage.removeItem('savedStaffNumber');
                    }

                    // Store user session
                    const sessionData = {
                        id: user.id || '',
                        staffNumber: user.staffNumber || staffNumber,
                        civilId: user.civilId || '',
                        type: user.type,
                        employeeType: user.employeeType || 'employee',
                        nameAr: user.nameAr || '',
                        nameEn: user.nameEn || '',
                        vehicleNumber: user.vehicleNumber || '',
                        canAccessDriver: user.canAccessDriver || false,
                        canAccessNurse: user.canAccessNurse || false,
                        loginTime: new Date().toISOString(),
                        language: currentLang
                    };
                    
                    localStorage.setItem('userSession', JSON.stringify(sessionData));
                    localStorage.setItem('appLanguage', currentLang);
                    
                    // Pre-warm target page data before redirect
                    var prefetchDone = false;
                    try {
                        var firstFetch = prefetchForUserType(user.type, sessionData.staffNumber);
                        if (firstFetch && firstFetch.then) {
                            firstFetch.then(function() { prefetchDone = true; }).catch(function() {});
                        }
                    } catch(e) {}
                    
                    // Prefetch target page HTML so browser has it cached
                    try {
                        var link = document.createElement('link');
                        link.rel = 'prefetch';
                        link.href = user.redirect;
                        document.head.appendChild(link);
                    } catch(e) {}
                    
                    // Wait for fast data fetch to complete (up to 2s max)
                    // This ensures pending trips are in localStorage before nurse page loads
                    var redirectTimer = setTimeout(function() {
                        window.location.href = user.redirect;
                    }, 2000);
                    if (firstFetch && firstFetch.then) {
                        firstFetch.then(function() {
                            clearTimeout(redirectTimer);
                            setTimeout(function() { window.location.href = user.redirect; }, 50);
                        }).catch(function() {});
                    }
                } else {
                    // User not found
                    resetLoginButton();
                    showError(currentLang === 'ar' ? 'الرقم الوظيفي أو المدني غير مسجل في النظام' : 'Staff number or Civil ID not registered in the system');
                }
            } catch (error) {
                clearTimeout(timeoutId);
                resetLoginButton();
                showError(currentLang === 'ar' ? 'حدث خطأ. يرجى المحاولة مرة أخرى' : 'An error occurred. Please try again');
            }
        }
        
        function resetLoginButton() {
            const loginBtn = document.getElementById('loginBtn');
            loginBtn.disabled = false;
            loginBtn.innerHTML = `<span data-ar="تسجيل الدخول" data-en="Login">${currentLang === 'ar' ? 'تسجيل الدخول' : 'Login'}</span>`;
        }

        // Show error message
        function showError(message) {
            const errorMessage = document.getElementById('errorMessage');
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
        }

        // Register Service Worker for PWA with aggressive auto-update
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js')
                .then(reg => {
                    console.log('[App] Service Worker registered successfully');
                    reg.update().catch(() => {});
                    setInterval(() => { reg.update(); }, 60000);
                    reg.addEventListener('updatefound', () => {
                        const newWorker = reg.installing;
                        console.log('[App] New Service Worker found, installing...');
                        newWorker.addEventListener('statechange', () => {
                            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                console.log('[App] New version available! Reloading...');
                                setTimeout(() => window.location.reload(), 1000);
                            }
                        });
                    });
                })
                .catch(err => console.error('[App] Service Worker registration failed:', err));
            var _reloading = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (!_reloading) { _reloading = true; window.location.reload(); }
            });
            navigator.serviceWorker.addEventListener('message', event => {
                if (event.data && event.data.type === 'SW_UPDATED') {
                    console.log('[App] ' + event.data.message);
                    if (!_reloading) { _reloading = true; window.location.reload(); }
                }
            });
        }
    </script>
